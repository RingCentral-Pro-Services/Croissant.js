name: Release Production Build and Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Manual release tag for production (e.g. v20260629, v20260629.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: RingCentral-Pro-Services/platform-actions/.github/workflows/pipeline-production.yml@v3.0.0
    with:
      repo_name:     ${{ github.event.repository.name }}
      ecr_repo_name: ${{ github.event.repository.name }}
      cluster:       psi-production-eks
      env_file:      .env.prod
      release_tag:   ${{ inputs.release_tag }}
    secrets:
      aws_role_arn:           arn:aws:iam::256329341370:role/psi-github-ci-role
      gitops_app_id:          ${{ secrets.PSI_GITOPS_CI_APP_ID }}
      gitops_app_private_key: ${{ secrets.PSI_GITOPS_CI_APP_PRIVATE_KEY }}